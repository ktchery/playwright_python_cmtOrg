name: UI tests

# Monthly, plus manual dispatch. Never on push.
#
# The suite exercises a third-party production site belonging to a nonprofit,
# and there is no staging environment, so the cadence is a deliberate trade
# rather than a default. Monthly is roughly 12 runs a year at 8 page loads each
# - about a hundred page views annually, which is indistinguishable from a
# person browsing the site occasionally. Weekly or per-push would be a visible,
# unexplained pattern of browser sessions against a server we do not operate.
#
# The point of a schedule at all is that this suite exists to catch the site
# drifting out from under the tests, and drift is exactly what a manual run
# cannot find - it went unnoticed here for two years. Monthly is slow enough to
# be polite and often enough to catch that.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 1 * *'  # 1st of the month, 13:00 UTC

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Firefox
        run: playwright install firefox --with-deps

      # submits_real_form is excluded: those tests post through the live contact
      # form, which reaches a real inbox. See pytest.ini.
      - name: Run tests
        env:
          HEADLESS: '1'
        run: pytest -v -m "not submits_real_form"

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            trace.zip
            videos/
            error_*.png
          retention-days: 7
          if-no-files-found: ignore
