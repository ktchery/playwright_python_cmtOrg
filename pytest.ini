[pytest]
markers =
    smoke: mark a test as part of the smoke suite.
    regression: mark a test as part of the regression suite.
    submits_real_form: sends a real message through the live contact form. Excluded
        from unattended runs: there is no staging site, so every run would land in a
        real nonprofit's inbox. Deselect with -m "not submits_real_form".
